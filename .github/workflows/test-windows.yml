name: Test Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Rust toolchain
        id: toolchain
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          "version=$(rustc --version)" >> $env:GITHUB_OUTPUT
      - name: Cache Cargo dependencies and test build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: xrun-${{ runner.os }}-${{ runner.arch }}-test-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: xrun-${{ runner.os }}-${{ runner.arch }}-test-${{ steps.toolchain.outputs.version }}-
      - name: Format, lint and test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: desktop/package.json
      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: xrun-${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('desktop/bun.lock', 'desktop/package.json') }}
          restore-keys: xrun-${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Build desktop installer
        working-directory: desktop
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          bun install --frozen-lockfile
          bun run check
          bun run build --debug --bundles nsis
      - name: Check desktop code and bundled helper
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo clippy --locked -p xrun-desktop --all-targets -- -D warnings
          $p = Start-Process -FilePath target/debug/xrun-desktop.exe -ArgumentList '--self-check' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw 'Desktop self-check failed' }

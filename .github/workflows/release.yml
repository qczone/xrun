name: Release

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Successful Package run ID from main whose artifacts should be published
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Publish tested packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: xrun-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
    steps:
      - name: Validate Package run
        id: package
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo '::error::Publish releases from main.'; exit 1; }
          [[ "$PACKAGE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::Specify a numeric Package run ID.'; exit 1; }
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/package.yml" --jq .id)
          metadata="$RUNNER_TEMP/xrun-package-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN_ID" > "$metadata"
          jq -e --argjson workflow "$workflow" --arg repository "$GITHUB_REPOSITORY" '
            .workflow_id == $workflow and .event == "workflow_dispatch" and
            .status == "completed" and .conclusion == "success" and .head_branch == "main" and
            .repository.full_name == $repository and .head_repository.full_name == $repository
          ' "$metadata" > /dev/null || { echo '::error::Choose a successful Package run from main in this repository.'; exit 1; }
          sha=$(jq -r .head_sha "$metadata")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Package commit is invalid.'; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.package.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: desktop/package.json
      - name: Download the six tested artifact sets
        shell: bash
        env:
          PACKAGE_SHA: ${{ steps.package.outputs.sha }}
        run: |
          set -euo pipefail
          gh run download "$PACKAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "xrun-*-$PACKAGE_SHA" --dir dist/artifacts
      - name: Verify and prepare Release assets
        id: assets
        shell: bash
        env:
          PACKAGE_SHA: ${{ steps.package.outputs.sha }}
        run: |
          set -euo pipefail
          version=$(bun desktop/scripts/release-assets.ts --artifacts dist/artifacts --directory dist/release --sha "$PACKAGE_SHA")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload and publish the complete Release
        shell: bash
        env:
          VERSION: ${{ steps.assets.outputs.version }}
          PACKAGE_SHA: ${{ steps.package.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq "[.[] | select(.ref == \"refs/tags/$tag\")] | length")
          test "$existing" = 0 || { echo "::error::Tag $tag already exists; use a new version."; exit 1; }
          flags=()
          if [[ "${VERSION%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$tag" dist/release/* --repo "$GITHUB_REPOSITORY" \
            --target "$PACKAGE_SHA" --title "xrun $VERSION" --draft "${flags[@]}" \
            --notes-file dist/release-notes.md
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false

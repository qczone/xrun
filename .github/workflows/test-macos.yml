name: Test macOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: '1'
      XRUN_TEST_LOG_DIR: ${{ github.workspace }}/target/test-logs
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Rust toolchain
        id: toolchain
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo dependencies and test build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: xrun-${{ runner.os }}-${{ runner.arch }}-test-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: xrun-${{ runner.os }}-${{ runner.arch }}-test-${{ steps.toolchain.outputs.version }}-
      - name: Format, lint and test
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          # Integration tests launch the CLI; build it after clippy to refresh cached binaries.
          cargo build --locked --bin xrun
          cargo test --locked
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: desktop/package.json
      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: xrun-${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('desktop/bun.lock', 'desktop/package.json') }}
          restore-keys: xrun-${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Build desktop App ZIP
        working-directory: desktop
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build --debug --verbose
      - name: Test installer architecture selection and manifest validation
        run: bun test tests/installer-platforms.test.ts
      - name: Check desktop code and bundled helper
        run: |
          cargo clippy --locked -p xrun-desktop --all-targets -- -D warnings
          cargo test --locked -p xrun-desktop
          target/debug/bundle/macos/xrun.app/Contents/MacOS/xrun-desktop --self-check
      - name: Test the App ZIP's bundled helper
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/xrun-app-smoke"
          mkdir -p "$smoke_dir"
          ditto -x -k target/debug/bundle/macos/xrun.app.zip "$smoke_dir"
          codesign --verify --deep --strict "$smoke_dir/xrun.app"
          export XRUN_TEST_BINARY="$smoke_dir/xrun.app/Contents/MacOS/xrun"
          cargo test --locked --test smoke -- --nocapture
      - name: Test automatic App installation and bundled CLI
        shell: bash
        run: bash tests/install-macos.sh target/debug
      - name: Upload failed test process logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ env.XRUN_TEST_LOG_DIR }}/*.log
          if-no-files-found: ignore
          retention-days: 7

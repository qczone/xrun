name: Test Linux
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: '1'
      XRUN_TEST_LOG_DIR: ${{ github.workspace }}/target/test-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Rust toolchain
        id: toolchain
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo dependencies and test build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: xrun-${{ runner.os }}-${{ runner.arch }}-test-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: xrun-${{ runner.os }}-${{ runner.arch }}-test-${{ steps.toolchain.outputs.version }}-
      - name: Format, lint and test
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          # Catch command stack overflows with a Windows-sized main-thread stack.
          ulimit -s 1024
          cargo test --locked
      - name: X11 screenshot
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libx11-6 libxrandr2
          xvfb-run -a -s '-screen 0 1024x768x24' cargo test --locked --test screenshot -- --ignored
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: cloudflare/package.json
      - name: Cache Cloudflare relay dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: xrun-${{ runner.os }}-${{ runner.arch }}-cloudflare-${{ hashFiles('cloudflare/bun.lock', 'cloudflare/package.json') }}
          restore-keys: xrun-${{ runner.os }}-${{ runner.arch }}-cloudflare-
      - name: Check Cloudflare relay in workerd
        working-directory: cloudflare
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test
      - name: Upload failed test process logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ env.XRUN_TEST_LOG_DIR }}/*.log
          if-no-files-found: ignore
          retention-days: 7

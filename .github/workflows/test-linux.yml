name: Test Linux
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      RUST_BACKTRACE: '1'
      XRUN_TEST_LOG_DIR: ${{ github.workspace }}/target/test-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust toolchain
        id: toolchain
        shell: bash
        run: |
          rustup set default-host '${{ matrix.target }}'
          rustup toolchain install --no-self-update
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - name: Cache Cargo dependencies and test build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: xrun-${{ runner.os }}-${{ matrix.target }}-test-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: xrun-${{ runner.os }}-${{ matrix.target }}-test-${{ steps.toolchain.outputs.version }}-
      - name: Format, lint and test
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          # Catch command stack overflows with a Windows-sized main-thread stack.
          ulimit -s 1024
          cargo test --locked
      - name: X11 screenshot
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libx11-6 libxrandr2
          xvfb-run -a -s '-screen 0 1024x768x24' cargo test --locked --test screenshot -- --ignored
      - name: Test real systemd service lifecycle
        shell: bash
        env:
          XRUN_TEST_SYSTEM_SERVICE: '1'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user is-system-running --wait || test "$?" -eq 1
          mkdir -p "$XRUN_TEST_LOG_DIR"
          trap 'journalctl --user -u xrun-daemon.service --no-pager > "$XRUN_TEST_LOG_DIR/systemd.log" || true' EXIT
          cargo test --locked --test service -- --ignored --nocapture
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: cloudflare/package.json
      - name: Cache Cloudflare relay dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: xrun-${{ runner.os }}-${{ matrix.target }}-cloudflare-${{ hashFiles('cloudflare/bun.lock', 'cloudflare/package.json') }}
          restore-keys: xrun-${{ runner.os }}-${{ matrix.target }}-cloudflare-
      - name: Check Cloudflare relay in workerd
        working-directory: cloudflare
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test
      - name: Test real Rust clients through Cloudflare workerd
        working-directory: cloudflare
        timeout-minutes: 15
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: bun run test:interop
      - name: Test real previous compatible builds
        timeout-minutes: 20
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          bun test scripts/compatibility-baseline.test.ts
          bun scripts/test-compatibility.ts
      - name: Test automatic CLI installation
        run: |
          bun test tests/installer-platforms.test.ts
          bash tests/install-linux.sh target/debug
      - name: Upload failed test process logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ env.XRUN_TEST_LOG_DIR }}/*.log
          if-no-files-found: ignore
          retention-days: 7

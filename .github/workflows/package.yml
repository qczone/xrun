name: Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            binary: xrun
          - platform: darwin-arm64
            runner: macos-15
            binary: xrun
          - platform: windows-x86_64
            runner: windows-2022
            binary: xrun.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install current stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
      - name: Cache Cargo dependencies and release build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: xrun-${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: xrun-${{ runner.os }}-${{ runner.arch }}-release-
      - name: Build Unix
        if: runner.os != 'Windows'
        shell: bash
        run: cargo build --locked --release
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --locked --release
      - name: Smoke test Unix
        if: runner.os != 'Windows'
        shell: bash
        run: target/release/xrun --version
      - name: Smoke test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\target\release\xrun.exe --version
      - name: Check macOS signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}
      - name: Sign macOS executable
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --timestamp --options runtime --identifier dev.qczone.xrun \
            --sign "$MACOS_SIGN_IDENTITY" target/release/xrun
          codesign --verify --strict --verbose=2 target/release/xrun
      - name: Notarize macOS executable
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 70
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          notary_dir="$(mktemp -d "$RUNNER_TEMP/xrun-notary.XXXXXX")"
          trap 'rm -rf "$notary_dir"' EXIT
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | tr -d '[:space:]' | base64 --decode > "$notary_dir/AuthKey.p8"
          unset APPLE_API_KEY_P8_BASE64
          ditto -c -k --keepParent target/release/xrun "$notary_dir/xrun.zip"
          xcrun notarytool submit "$notary_dir/xrun.zip" \
            --key "$notary_dir/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 60m \
            --output-format json > "$notary_dir/status.json"
          jq -r '"Notarization: \(.status) (\(.id))"' "$notary_dir/status.json"
          jq -e '.status == "Accepted"' "$notary_dir/status.json" > /dev/null
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/release/${{ matrix.binary }}" LICENSE README.md dist/package/
          tar -C dist/package -czf "dist/xrun-${{ matrix.platform }}.tar.gz" .
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}", LICENSE, README.md -Destination dist/package
          Compress-Archive -Path dist/package/* -DestinationPath "dist/xrun-${{ matrix.platform }}.zip"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: runner.os != 'Linux'
        with:
          bun-version-file: desktop/package.json
      - name: Cache Bun dependencies
        if: runner.os != 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: xrun-${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('desktop/bun.lock', 'desktop/package.json') }}
          restore-keys: xrun-${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Build macOS App
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build --bundles app
      - name: Sign and notarize macOS App
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 70
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          app=target/release/bundle/macos/xrun.app
          codesign --force --timestamp --options runtime --identifier dev.qczone.xrun.daemon --sign "$MACOS_SIGN_IDENTITY" "$app/Contents/MacOS/xrun"
          codesign --force --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" "$app/Contents/MacOS/xrun-desktop"
          codesign --force --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" "$app"
          codesign --verify --deep --strict "$app"
          umask 077
          notary_dir="$(mktemp -d "$RUNNER_TEMP/xrun-app-notary.XXXXXX")"
          trap 'rm -rf "$notary_dir"' EXIT
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | tr -d '[:space:]' | base64 --decode > "$notary_dir/AuthKey.p8"
          unset APPLE_API_KEY_P8_BASE64
          ditto -c -k --keepParent "$app" "$notary_dir/xrun.zip"
          xcrun notarytool submit "$notary_dir/xrun.zip" --key "$notary_dir/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 60m --output-format json > "$notary_dir/status.json"
          jq -e '.status == "Accepted"' "$notary_dir/status.json" > /dev/null
          xcrun stapler staple "$app"
          ditto -c -k --keepParent "$app" dist/xrun-app-darwin-arm64.zip
      - name: Build Windows App installer
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          bun install --frozen-lockfile
          bun run check
          bun run build --bundles nsis
          Copy-Item ../target/release/bundle/nsis/*.exe ../dist/xrun-app-windows-x86_64.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xrun-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/xrun-${{ matrix.platform }}.*
            dist/xrun-app-${{ matrix.platform }}.*
          if-no-files-found: error

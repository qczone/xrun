name: Package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the completed artifacts to a versioned GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      RUST_BACKTRACE: '1'
      XRUN_TEST_LOG_DIR: ${{ github.workspace }}/target/test-logs
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            arch: x86_64
            host: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            host: aarch64-unknown-linux-gnu
            target: aarch64-unknown-linux-gnu
          - platform: darwin-arm64
            runner: macos-15
            arch: arm64
            host: aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: darwin-x86_64
            runner: macos-15
            arch: x86_64
            host: aarch64-apple-darwin
            target: x86_64-apple-darwin
          - platform: windows-x86_64
            runner: windows-2022
            arch: x86_64
            msvc_arch: x64
            host: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - platform: windows-arm64
            runner: windows-11-arm
            arch: arm64
            msvc_arch: arm64
            host: aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Rust toolchain
        id: toolchain
        shell: bash
        run: |
          rustup set default-host '${{ matrix.host }}'
          rustup toolchain install --no-self-update
          rustup target add '${{ matrix.target }}'
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"
      - name: Prepare Rosetta for Intel macOS tests
        if: matrix.platform == 'darwin-x86_64'
        shell: bash
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true
          echo 'CARGO_TARGET_X86_64_APPLE_DARWIN_RUNNER=arch -x86_64' >> "$GITHUB_ENV"
      - name: Cache Cargo dependencies and release build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/${{ matrix.target }}/release
          key: xrun-${{ runner.os }}-${{ matrix.target }}-release-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: xrun-${{ runner.os }}-${{ matrix.target }}-release-${{ steps.toolchain.outputs.version }}-
      - name: Build Unix
        if: runner.os != 'Windows'
        shell: bash
        run: cargo build --locked --release --target '${{ matrix.target }}'
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --locked --release --target '${{ matrix.target }}'
      - name: Smoke test Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ '${{ runner.os }}' = macOS ]; then
            lipo 'target/${{ matrix.target }}/release/xrun' -verify_arch '${{ matrix.arch }}'
            /usr/bin/arch -${{ matrix.arch }} 'target/${{ matrix.target }}/release/xrun' --version
          else
            'target/${{ matrix.target }}/release/xrun' --version
          fi
      - name: Smoke test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./target/${{ matrix.target }}/release/xrun.exe --version
      - name: Check macOS signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret: $name"; exit 1; fi
          done
      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}
      - name: Package Linux CLI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/xrun-${{ matrix.platform }}.tar.gz" xrun
      - name: Test the Linux CLI archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$(tar -tzf 'dist/xrun-${{ matrix.platform }}.tar.gz')" = xrun
          smoke_dir="$RUNNER_TEMP/xrun-cli-smoke"
          mkdir -p "$smoke_dir"
          tar -xzf "dist/xrun-${{ matrix.platform }}.tar.gz" -C "$smoke_dir"
          export XRUN_TEST_BINARY="$smoke_dir/xrun"
          cargo test --locked --release --target '${{ matrix.target }}' --test smoke -- --nocapture
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: desktop/package.json
      - name: Cache Bun dependencies
        if: runner.os != 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: xrun-${{ runner.os }}-${{ matrix.target }}-bun-${{ hashFiles('desktop/bun.lock', 'desktop/package.json') }}
          restore-keys: xrun-${{ runner.os }}-${{ matrix.target }}-bun-
      - name: Build, sign and notarize macOS App ZIP
        if: runner.os == 'macOS'
        working-directory: desktop
        shell: bash
        timeout-minutes: 100
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run check
          umask 077
          notary_dir="$(mktemp -d "$RUNNER_TEMP/xrun-app-notary.XXXXXX")"
          trap 'rm -rf "$notary_dir"' EXIT
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | tr -d '[:space:]' | base64 --decode > "$notary_dir/AuthKey.p8"
          unset APPLE_API_KEY_P8_BASE64
          umask 022
          # Tauri signs nested binaries and notarizes/staples the complete App.
          export APPLE_SIGNING_IDENTITY="$MACOS_SIGN_IDENTITY"
          export APPLE_API_ISSUER="$APPLE_API_ISSUER_ID"
          export APPLE_API_KEY="$APPLE_API_KEY_ID"
          export APPLE_API_KEY_PATH="$notary_dir/AuthKey.p8"
          bun run build --target '${{ matrix.target }}' --verbose
          app=../target/${{ matrix.target }}/release/bundle/macos/xrun.app
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          mkdir -p ../dist
          cp "${app}.zip" ../dist/xrun-app-${{ matrix.platform }}.zip
      - name: Build Windows App installer
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          bun install --frozen-lockfile
          bun run check
          bun run build --target '${{ matrix.target }}' --verbose
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Copy-Item ../target/${{ matrix.target }}/release/bundle/nsis/*.exe ../dist/xrun-app-${{ matrix.platform }}.exe
      - name: Prepare artifact manifest and automatic installer
        shell: bash
        run: bun desktop/scripts/package-manifest.ts --platform '${{ matrix.platform }}' --directory dist
      - name: Test the notarized App ZIP helper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/xrun-app-smoke"
          mkdir -p "$smoke_dir"
          ditto -x -k dist/xrun-app-${{ matrix.platform }}.zip "$smoke_dir"
          codesign --verify --deep --strict "$smoke_dir/xrun.app"
          xcrun stapler validate "$smoke_dir/xrun.app"
          export XRUN_TEST_BINARY="$smoke_dir/xrun.app/Contents/MacOS/xrun"
          cargo test --locked --release --target '${{ matrix.target }}' --test smoke -- --nocapture
      - name: Install and test the release App helper
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $installDir = Join-Path $env:RUNNER_TEMP 'xrun-app-smoke'
          $p = Start-Process -FilePath (Resolve-Path dist/xrun-app-${{ matrix.platform }}.exe).Path -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath (Join-Path $installDir 'xrun-desktop.exe') -ArgumentList '--self-check' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw 'Installed desktop self-check failed' }
          $env:XRUN_TEST_BINARY = Join-Path $installDir 'xrun.exe'
          cargo test --locked --release --target '${{ matrix.target }}' --test smoke -- --nocapture
      - name: Test automatic macOS installation
        if: runner.os == 'macOS'
        shell: bash
        run: bash tests/install-macos.sh 'target/${{ matrix.target }}/release' dist --release --arch '${{ matrix.arch }}' --target '${{ matrix.target }}'
      - name: Test automatic Linux installation
        if: runner.os == 'Linux'
        shell: bash
        run: bash tests/install-linux.sh 'target/${{ matrix.target }}/release' dist --release --target '${{ matrix.target }}'
      - name: Test automatic Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install-windows.ps1 -ProfileDir 'target/${{ matrix.target }}/release' -ArtifactDir dist -Release -Arch '${{ matrix.arch }}' -Target '${{ matrix.target }}'
      - name: Upload failed package test process logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-test-logs-${{ matrix.platform }}-${{ github.run_attempt }}
          path: ${{ env.XRUN_TEST_LOG_DIR }}/*.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xrun-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/xrun-${{ matrix.platform }}.*
            dist/xrun-app-${{ matrix.platform }}.*
            dist/install.sh
            dist/install.ps1
          if-no-files-found: error

  release:
    name: Publish Release
    needs: package
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: xrun-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: desktop/package.json
      - name: Download the six tested artifact sets
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo '::error::Publish releases from main.'; exit 1; }
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "xrun-*-$GITHUB_SHA" --dir dist/artifacts
      - name: Verify and prepare Release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(bun desktop/scripts/release-assets.ts --artifacts dist/artifacts --directory dist/release --sha "$GITHUB_SHA")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload and publish the complete Release
        shell: bash
        env:
          VERSION: ${{ steps.assets.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq "[.[] | select(.ref == \"refs/tags/$tag\")] | length")
          test "$existing" = 0 || { echo "::error::Tag $tag already exists; use a new version."; exit 1; }
          flags=()
          if [[ "${VERSION%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$tag" dist/release/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "xrun $VERSION" --draft "${flags[@]}" \
            --notes-file dist/release-notes.md
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false

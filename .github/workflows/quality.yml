name: Readability
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: desktop/package.json
      - name: Install existing formatter and test dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Verify the readability checker
        run: bun test desktop/tests/quality.test.ts scripts/compatibility-baseline.test.ts
      - name: Enforce source readability and typed relay states
        run: bun desktop/scripts/check-quality.ts

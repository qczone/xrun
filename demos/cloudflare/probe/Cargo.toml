[package]
name = "xrun-cloudflare-probe"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
xrun = { path = "../../.." }
anyhow = "1.0.104"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = "0.23.45"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-tungstenite = "0.30.0"
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
webpki-roots = "1.0.9"

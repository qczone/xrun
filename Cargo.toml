[package]
name = "xrun"
version = "0.1.0-rc.3"
edition = "2024"

[workspace]
members = ["desktop/src-tauri"]
default-members = ["."]
resolver = "3"

[features]
desktop-helper = []

# Some Rust/LLVM versions misalign stripped proc-macro dylibs on macOS 27.
[profile.dev.build-override]
strip = "none"

[profile.release.build-override]
strip = "none"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
libc = "0.2.190"
png = "0.18"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
ring = "0.17.14"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = "0.23.45"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.7"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
webpki-roots = "1"
x509-parser = "0.18.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }

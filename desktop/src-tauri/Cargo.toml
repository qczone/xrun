[package]
name = "xrun-desktop"
version = "0.1.0-rc.2"
edition = "2024"

[[test]]
name = "native_ui"
path = "tests/native_ui.rs"
harness = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "time"] }
xrun = { path = "../.." }
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
tempfile = "3.27.0"
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError"] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Environment"] }
